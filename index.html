<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кит Анимация</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  
  <style>
    :root {
      --neon-cyan: #00f3ff; 
      --deep-blue: #03101e;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      background: radial-gradient(circle at center, #0a1128, #000000 100%);
      color: #b3d3d4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 30px 20px 10px;
      z-index: 10;
      pointer-events: none; 
      background: transparent; 
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: 4px;
      text-shadow: 
        0 0 50px rgba(0, 243, 255, 0.8),
        0 0 100px rgba(0, 243, 255, 0.5),
        0 0 200px rgba(0, 243, 255, 0.2);
      color: #ffffff;
    }

    p {
      margin: 10px 0 0;
      font-size: 1rem;
      color: #88b0c4;
      letter-spacing: 1px;
      font-family: Arial, sans-serif; /* Для мелкого текста лучше читаемый */
    }

    .viewer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; 
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    model-viewer::part(default-ar-button) {
      background-color: transparent;
      border: 2px solid var(--neon-cyan);
      border-radius: 50px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      color: var(--neon-cyan);
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    .controls-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(3, 16, 30, 0.7); /* Темный полупрозрачный фон */
      padding: 15px 25px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 243, 255, 0.3);
      z-index: 20;
    }

    .btn {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn:hover, .btn.active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <header>
    <h1>свечение бездны</h1>
  </header>

  <div class="viewer-container">
    <model-viewer 
      id="whaleViewer"
      src="assets/whale2.glb" 
      alt="3D модель светящегося кита"
      camera-controls 
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1.5"
      environment-image="neutral"
      exposure="1.5"
      camera-orbit="45deg 70deg 20m"
      min-camera-orbit="auto auto 10m"
      max-camera-orbit="auto auto 30m"
      camera-target="0 -0.3m 0"
      touch-action="pan-y"
      interaction-prompt="none"
      autoplay>
    </model-viewer>

    <div class="controls-panel">
      <button id="btnPlayPause" class="btn">  ⏸  </button>
      <button id="btnReset" class="btn">🔄</button>
    </div>

  <script>
    const viewer = document.getElementById('whaleViewer');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnGlow = document.getElementById('btnGlow');
    const btnReset = document.getElementById('btnReset');

    viewer.addEventListener('load', () => {
      console.log('Доступные анимации:', viewer.availableAnimations);
      
      if (viewer.availableAnimations.length > 0) {
        btnPlayPause.addEventListener('click', () => {
          if (viewer.paused) {
            viewer.play();
            btnPlayPause.textContent = ' ⏸ ';
            btnPlayPause.classList.remove('active');
          } else {
            viewer.pause();
            btnPlayPause.textContent = ' ▶️ ';
            btnPlayPause.classList.add('active');
          }
        });
      } else {
        btnPlayPause.textContent = 'Нет анимации';
        btnPlayPause.disabled = true;
      }
    });

      btnReset.addEventListener('click', () => {
      viewer.cameraOrbit = '45deg 70deg 3m';
      viewer.cameraTarget = '0 -0.3m 0';
      viewer.fieldOfView = 'auto';
    });
  </script>

</body>
</html>
